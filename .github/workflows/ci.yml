name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
      # n8n-workflow pulls isolated-vm, whose native build the node never uses.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run conformance
      # n8n's community-package scanner, as its local scan (N8N-REQ-010).
      - run: npm run scan
